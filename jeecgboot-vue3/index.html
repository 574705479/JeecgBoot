<!DOCTYPE html>
<html lang="zh_CN" id="htmlRoot">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0,viewport-fit=cover"
    />

    <title><%= title %></title>
    <link rel="icon" href="<%= basePublicPath %>/logo.svg" />
    <!-- 全局配置 -->
    <script>
      window._CONFIG = {};
      // 品牌配置（用于登录加载页等，避免残留默认文案）
      try {
        var storedBrand = localStorage.getItem('CS_BRAND_CONFIG');
        if (storedBrand) {
          window.__APP_BRAND__ = Object.assign({}, window.__APP_BRAND__ || {}, JSON.parse(storedBrand));
        }
      } catch (e) {}
      window.__APP_BRAND__ = window.__APP_BRAND__ || {
        title: '在线客服',
        shortTitle: '在线客服',
        subtitle: '欢迎使用在线客服',
        logoUrl: '<%= basePublicPath %>/logo.svg',
        faviconUrl: '<%= basePublicPath %>/logo.svg',
        loginBgUrl: '',
        loadingTitle: '在线客服',
      };
      if (window.__APP_BRAND__ && window.__APP_BRAND__.title) {
        document.title = window.__APP_BRAND__.title;
      }
    </script>
  </head>
  <body>
    <script>
      (() => {
        var htmlRoot = document.getElementById('htmlRoot');
        var theme = window.localStorage.getItem('__APP__DARK__MODE__');
        if (htmlRoot && theme) {
          htmlRoot.setAttribute('data-theme', theme);
          theme = htmlRoot = null;
        }
      })();
    </script>
    <div id="app">
      <style>
        html[data-theme='dark'] .app-loading {
          background-color: #2c344a;
        }

        html[data-theme='dark'] .app-loading .app-loading-title {
          color: rgba(255, 255, 255, 0.85);
        }

        .app-loading {
          display: flex;
          width: 100%;
          height: 100%;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          background-color: #f4f7f9;
        }

        .app-loading .app-loading-wrap {
          position: absolute;
          top: 50%;
          left: 50%;
          display: flex;
          -webkit-transform: translate3d(-50%, -50%, 0);
          transform: translate3d(-50%, -50%, 0);
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }

        .app-loading .dots {
          display: flex;
          padding: 98px;
          justify-content: center;
          align-items: center;
        }

        .app-loading .app-loading-title {
          display: flex;
          margin-top: 30px;
          font-size: 30px;
          color: rgba(0, 0, 0, 0.85);
          justify-content: center;
          align-items: center;
        }

        .app-loading .app-loading-logo {
          display: block;
          width: 90px;
          margin: 0 auto;
          margin-bottom: 20px;
        }

        .dot {
          position: relative;
          display: inline-block;
          width: 48px;
          height: 48px;
          margin-top: 30px;
          font-size: 32px;
          transform: rotate(45deg);
          box-sizing: border-box;
          animation: antRotate 1.2s infinite linear;
        }

        .dot i {
          position: absolute;
          display: block;
          width: 20px;
          height: 20px;
          background-color: #0065cc;
          border-radius: 100%;
          opacity: 0.3;
          transform: scale(0.75);
          animation: antSpinMove 1s infinite linear alternate;
          transform-origin: 50% 50%;
        }

        .dot i:nth-child(1) {
          top: 0;
          left: 0;
        }

        .dot i:nth-child(2) {
          top: 0;
          right: 0;
          -webkit-animation-delay: 0.4s;
          animation-delay: 0.4s;
        }

        .dot i:nth-child(3) {
          right: 0;
          bottom: 0;
          -webkit-animation-delay: 0.8s;
          animation-delay: 0.8s;
        }

        .dot i:nth-child(4) {
          bottom: 0;
          left: 0;
          -webkit-animation-delay: 1.2s;
          animation-delay: 1.2s;
        }
        @keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }
        @-webkit-keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }
        @keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }
        @-webkit-keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-wrap">
          <img id="app-loading-logo" src="<%= basePublicPath %>/logo.svg" class="app-loading-logo" alt="Logo" />
          <div class="app-loading-dots">
            <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="app-loading-title" id="app-loading-title"><%= title %></div>
        </div>
      </div>
      <script>
        (function () {
          var isFileProtocol = location.protocol === 'file:';
          function fixPath(url) {
            if (isFileProtocol && url && url.charAt(0) === '/' && url.indexOf('/', 1) === -1) {
              return '.' + url;
            }
            return url;
          }
          // 检测 cse:// 协议：浏览器不识别，inline JS 也无法解密。
          // 直接退回默认 logo，等 main.ts 加载完成后由 applyBrandToDom 异步替换为公开代理 URL。
          // 不在 inline JS 转换为 /cs/brand/file/{fid}：避免硬编码后端上下文路径（dev / nginx 反代环境不同）。
          function safe(url) {
            if (typeof url !== 'string' || !url) return '';
            if (url.indexOf('cse://') === 0) return '';
            return fixPath(url);
          }
          var brand = window.__APP_BRAND__ || {};
          var el = document.getElementById('app-loading-title');
          if (el) el.textContent = brand.loadingTitle || brand.title || el.textContent || '';
          // 根据品牌配置替换 loading logo（cse:// 退回默认）
          var logoUrl = safe(brand._resolvedLogoUrl) || safe(brand.logoUrl);
          if (logoUrl) {
            var logoEl = document.getElementById('app-loading-logo');
            if (logoEl) logoEl.src = logoUrl;
          }
          // 根据品牌配置替换 favicon（cse:// 退回默认；main.ts 完成后会异步覆盖）
          var faviconUrl = safe(brand._resolvedFaviconUrl) || safe(brand.faviconUrl) || logoUrl;
          if (faviconUrl) {
            var iconLinks = document.querySelectorAll("link[rel='icon'], link[rel='shortcut icon']");
            for (var i = 0; i < iconLinks.length; i++) {
              iconLinks[i].href = faviconUrl;
            }
          }
        })();
      </script>
    </div>
    <script type="module" src="/src/main.ts"></script>

  </body>
</html>
