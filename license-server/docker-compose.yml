version: '3'
services:
  license-mysql:
    image: mysql:8.0
    ports: ["13307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-license123}
      MYSQL_DATABASE: license_server
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  license-server:
    build: .
    ports: ["8180:8080"]
    depends_on: [license-mysql]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://license-mysql:3306/license_server?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-license123}
      LICENSE_MASTER_KEY: ${LICENSE_MASTER_KEY}

  license-frontend:
    build: ./frontend
    ports: ["8181:80"]
    depends_on: [license-server]

networks:
  default:
    name: license-network
