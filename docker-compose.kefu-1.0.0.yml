version: '2'
services:
  #这是服务器端部署用的yml配置，domain要改成对应的仓库域名地址，mysql后续没有改动就只需要制作一次镜像，后续有变更的正常只有system和vue.
  kefu-mysql:
    image: domain/kefu-mysql:1.0.0
    environment:
      MYSQL_ROOT_PASSWORD: 92400bda284afba53b21162911f98d00Z
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    restart: always
    container_name: kefu-mysql
    # 🔒 数据持久化配置 - 防止容器重建时数据丢失
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_allowed_packet=128M
      --default-authentication-plugin=caching_sha2_password
    ports:
      - 13306:3306
    networks:
      - kefu

  kefu-redis:
    image: redis:8.0
    ports:
      - 6379:6379
    # 🔒 数据持久化配置 - 防止容器重建时数据丢失
    volumes:
      - ./docker-data/redis:/data
    restart: always
    hostname: kefu-redis
    container_name: kefu-redis
    command: redis-server --appendonly yes --appendfsync everysec --requirepass 92400bda284afba53b21162911f98d00Z
    networks:
      - kefu

  kefu-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/pgvector
    container_name: kefu-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 92400bda284afba53b21162911f98d00Z
      POSTGRES_DB: vector_db
    ports:
      - 5432:5432
    restart: always
    networks:
      - kefu

  kefu-mongodb:
    image: mongo:8.2.3
    container_name: kefu-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 92400bda284afba53b21162911f98d00Z
      MONGO_INITDB_DATABASE: jeecg
      TZ: Asia/Shanghai
    ports:
      - 27017:27017
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - kefu
      
  kefu-system:
    image: domain/kefu-system:1.0.0
    restart: on-failure
    environment:
      SPRING_APPLICATION_JSON: '{"spring":{"data":{"mongodb":{"authentication-database":"admin"}}}}'
    depends_on:
      - kefu-mysql
      - kefu-redis
    container_name: kefu-system
    hostname: kefu-system
    ports:
      - 8080:8080
    volumes:
      - ./docker-data/upload:/opt/jeecg-boot/upload
      - ./docker-data/webapp:/opt/jeecg-boot/webapp
    networks:
      - kefu

  kefu-vue:
    image: domain/kefu-vue:1.0.0
    container_name: kefu-vue-nginx
    depends_on:
      - kefu-system
    networks:
      - kefu
    ports:
      - 3111:80

networks:
  kefu:
    name: kefu
